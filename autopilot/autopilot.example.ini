; HydroSim autopilot — the unmanned expo stand (FTI).
; Copy to autopilot.ini (windows\install-fti.ps1 does this and fills the token).

[server]
url = http://127.0.0.1:8088
; = API_TOKEN from the .env in the repo root
token = CHANGE-ME

[ac]
; Folder that contains acs.exe (Steam > Assetto Corsa > Manage > Browse local files)
install_dir = C:\Program Files (x86)\Steam\steamapps\common\assettocorsa
; Documents\Assetto Corsa\cfg — leave empty to find it automatically
cfg_dir =
; Folder name of the car under content\cars (look it up there or in Content
; Manager). The autopilot refuses to start with a wrong name and lists the
; folders that look like a Radical.
car =
; Skin folder under content\cars\<car>\skins — empty = the first one
skin =
track = spa
track_config =
; hotlap = flying lap (car spawns just before the line)   <- recommended
; race   = one-lap race from a standing start with start lights
session = hotlap
; AC normally drops the driver straight into the car (race.ini AUTOSPAWN).
; If it still opens on its start menu (red side bar, "Session control"),
; the autopilot clicks the steering-wheel icon (top left) itself. Record its
; position once: .venv\Scripts\python -m autopilot --where , start a run
; and click the icon — it is written here automatically.
start_click =
; seconds after AC is live before clicking; how many clicks (1 is safest)
start_click_delay = 3
start_click_tries = 1

[assists]
; Visitors have never driven a race car: help them.
; abs / traction_control: 0 = off, 1 = car's factory setting, 2 = on
auto_shifter = 1
auto_clutch = 1
auto_blip = 1
abs = 1
traction_control = 1
stability = 0
ideal_line = 0
damage = 0

[conditions]
weather = 3_clear
ambient = 22
road = 28
; -80 = 08:00 … 0 = 13:00 … 80 = 18:00
sun_angle = 16

[run]
; seconds
start_timeout = 120
max_run = 420
idle_abort = 45
finish_hold = 5
name_timeout = 90
result = 25
result_min = 6
message = 8

[wheel]
; Which controller starts a run. Empty = any controller. Run
;   .venv\Scripts\python -m autopilot --learn
; and press the button to see its numbers.
joystick =
; Comma-separated button numbers, empty = any button
buttons =

[keyboard]
; 1 = the keyboard only types names; every other key (Alt+Tab, Win, Alt+F4,
; Esc, Ctrl+…) is swallowed. Run windows\lockdown.ps1 once as administrator
; (+ reboot): it switches Ctrl and Alt off entirely, so Ctrl+Alt+Del can't be
; pressed, and disables Win+L — no program can intercept those two.
lock = 1
; Type this code (anywhere, any time) to release the keyboard for
; admin_minutes; type it again to lock immediately.
admin_code = CHANGE-ME
admin_minutes = 10
; Optional keyboard key that also starts a run (e.g. F9 for a USB arcade button)
start_key =

[screen]
; The autopilot opens (and re-opens, if it ever closes) the expo screen.
manage_browser = 1
browser = auto
url = http://127.0.0.1:8088/expo
; Top-left pixel of the second screen (1920,0 = right of a 1920-wide main screen)
position = 1920,0
; Between runs the MAIN monitor shows a HydroTeam screen instead of the
; Windows desktop (closed automatically while Assetto Corsa runs).
main_screen = 1
main_url = http://127.0.0.1:8088/expo/main
main_position = 0,0
