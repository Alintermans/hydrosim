<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HydroSim Timing{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens/colors.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens/typography.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens/spacing.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ds/tokens/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <div class="flash flash--{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</body>
</html>
