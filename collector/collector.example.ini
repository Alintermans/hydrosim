; HydroSim collector configuration.
; Copy this file to collector.ini (windows\install.ps1 does it for you).

[server]
; The LOCAL timing server on this PC (serve_windows.py).
url = http://127.0.0.1:8088
; Must equal API_TOKEN in the server's .env — install.ps1 keeps them in sync.
token = CHANGE-ME
; Laps that could not be delivered wait here until the server is back.
; queue_file = queue.jsonl

[timing]
; How often to poll shared memory. 20 Hz is plenty for lap detection.
poll_hz = 20
; A "cut" is an excursion with at least this many tyres off track.
; 4 = only fully off-track counts (AC's own penalty logic); 3 is stricter.
tyres_out_threshold = 4
